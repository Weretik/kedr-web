name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution, and replace "e2e" with "e2e-ci" in the command below
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci
      - run: npm ls --all
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npx nx run-many -t lint
      - run: npx nx run-many -t typecheck
      - run: npm run typecheck:tests
      - run: npm run test:web
      - run: npm run test:mobile
      - run: npm run test:web:e2e
      - run: npx nx build admin --configuration=production
      - run: npx nx build storefront --configuration=production
