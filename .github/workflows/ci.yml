name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

# A new push to a pull request cancels the run for its previous commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks run as parallel jobs; the final `main` job keeps the single status the branch rules expect.
jobs:
  checks:
    name: lint and repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
        with:
          cache-name: checks
      - run: node tools/ci/check-dependency-tree.mjs
      - run: npm run security:audit
      - run: npm run contracts:fixtures
      - run: npm run contracts:check
      # The snapshot must equal the contract on the KedrStore default branch; `npm run contracts:sync` refreshes it.
      - run: npm run contracts:drift
      - run: npm run docs:check
      - run: node --test .claude/hooks/guard.test.mjs
      - run: npm run architecture:boundaries
      - run: npm run architecture:structure:fixtures
      - run: npm run architecture:structure
      - run: npm run ci:test-scripts:fixtures
      - run: npm run ci:test-scripts
      - run: npx nx $NX_MODE -t lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
        with:
          cache-name: typecheck
      - run: npx nx $NX_MODE -t typecheck
      - run: npm run typecheck:tests

  test:
    name: unit and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
        with:
          cache-name: test
      - run: node tools/ci/run-affected.mjs test:web
      - run: node tools/ci/run-affected.mjs test:mobile
      - run: node tools/ci/run-affected.mjs test:site

  build:
    name: production builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci
        with:
          cache-name: build
      - name: Choose affected apps
        id: scope
        run: |
          for project in admin site; do
            echo "$project=$(node tools/ci/run-affected.mjs --check $project)" >> "$GITHUB_OUTPUT"
          done
          npx nx show projects --affected | sed 's/^/affected: /' || true
      - if: steps.scope.outputs.admin == 'true'
        run: npx nx build admin --configuration=production
      - if: steps.scope.outputs.site == 'true'
        run: npx nx build site

  main:
    name: main
    if: always()
    needs: [checks, typecheck, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
