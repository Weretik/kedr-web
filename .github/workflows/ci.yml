name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution, and replace "e2e" with "e2e-ci" in the command below
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Pull requests check only the projects their changes affect; pushes to main check everything.
      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main
      - name: Choose check scope
        id: scope
        run: |
          echo "CI_SCOPE=${{ github.event_name == 'push' && 'all' || 'affected' }}" >> "$GITHUB_ENV"
          echo "NX_MODE=${{ github.event_name == 'push' && 'run-many' || 'affected' }}" >> "$GITHUB_ENV"
          export CI_SCOPE=${{ github.event_name == 'push' && 'all' || 'affected' }}
          for project in admin-e2e admin storefront site; do
            echo "$project=$(node tools/ci/run-affected.mjs --check $project)" >> "$GITHUB_OUTPUT"
          done
          npx nx show projects --affected | sed 's/^/affected: /' || true

      - run: npm ls --all
      - run: npm run security:audit
      - run: npm run contracts:check
      - run: npm run docs:check
      - run: npx nx $NX_MODE -t lint
      - run: npm run architecture:boundaries
      - run: npx nx $NX_MODE -t typecheck
      - run: npm run typecheck:tests
      - run: node tools/ci/run-affected.mjs test:web
      - run: node tools/ci/run-affected.mjs test:mobile
      - run: node tools/ci/run-affected.mjs test:site

      # The Playwright browser is cached by version; system libraries still come from apt.
      - name: Read Playwright version
        if: steps.scope.outputs.admin-e2e == 'true'
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.scope.outputs.admin-e2e == 'true'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.scope.outputs.admin-e2e == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.scope.outputs.admin-e2e == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - if: steps.scope.outputs.admin-e2e == 'true'
        run: npm run test:web:e2e

      - if: steps.scope.outputs.admin == 'true'
        run: npx nx build admin --configuration=production
      - if: steps.scope.outputs.storefront == 'true'
        run: npx nx build storefront --configuration=production
      - if: steps.scope.outputs.site == 'true'
        run: npx nx build site
