        handles: 'Ручки',
        cylinders: 'Цилиндры',
        mechanisms: 'Межкомнатные механизмы',
        other: 'Другое',
        doors: 'Двери',
        regions: 'Регионы',
        cooperation: 'Сотрудничество',
        rosette: 'Ручки на розетке',
        shortName: 'Дверная ручка',
        sku: 'Арт.',
        skuLong: 'Артикул',
        productName: 'Дверная ручка на квадратной розетке',
        categoryLabel: 'Категория:',
        retail: 'Розничная цена',
        pack: 'В упаковке: 10 шт.',
        packValue: '10 шт.',
        wholesaleTitle: 'Покупаете оптом?',
        wholesaleText: 'Уточните условия сотрудничества у менеджера.',
        wholesaleAction: 'Партнёрам',
        deliveryLink: 'Условия доставки по Украине',
        paymentLink: 'Способы и условия оплаты',
        returnLink: 'Возврат и обмен',
        aboutProduct: 'О товаре',
        quantityPack: 'Количество в упаковке',
        availability: 'Наличие',
        deliveryText:
          'Доступные способы доставки и оплаты смотрите в соответствующем разделе. Менеджер поможет согласовать детали вашего заказа.',
        deliveryAction: 'Условия доставки и оплаты',
        returnsText: 'Условия возврата, обмена и гарантии собраны на отдельной странице.',
        returnAction: 'Правила возврата и гарантии',
        helpTitle: 'Нужна помощь с выбором?',
        helpText: 'Обратитесь к менеджеру — поможем с вашим заказом.',
        footerTagline: 'Дверная фурнитура оптом',
        companyGroup: 'Компания',
        buyers: 'Покупателям',
        offer: 'Публичная оферта',
        requisites: 'Реквизиты',
        copyright: '© 2026 Class Kedr. Все права защищены.',
        privacy: 'Политика конфиденциальности',
        photoCaption: 'Фото товара',
        onePhoto: '1 фото',
        noPhoto: 'Фото товара ещё не добавлено',
        inStock: 'В наличии',
        outStock: 'Нет в наличии',
        cart: 'Корзина',
        emptyCart: 'Корзина пуста',
        buy: 'В корзину',
        added: 'Добавлено',
        requestPrice: 'Цена по запросу',
        requestAction: 'Запросить цену',
        outAction: 'Уточнить наличие',
        decrease: 'Уменьшить количество',
        increase: 'Увеличить количество',
        map: 'Карта',
        cabinet: 'Кабинет',
        home: 'Главная',
        photo: 'Фото товара',
        zoom: 'Увеличить фото',
        copy: 'Скопировать артикул',
        close: 'Закрыть',
        search: 'Поиск по артикулу или названию',
        sum: 'Итого',
        units: 'шт.',
        addedMessage: 'Товар добавлен в корзину',
        copied: 'Артикул DEMO-001',
        queryMessage: 'Позвоните менеджеру, чтобы уточнить цену.',
        outMessage: 'Позвоните менеджеру, чтобы уточнить наличие.',
      },
    };
    const state = {
      appearance: 'auto',
      device: 'desktop',
      locale: 'uk',
      productState: 'available',
      qty: 1,
      cart: 0,
      added: false,
      zoom: false,
      menu: false,
      cartOpen: false,
      message: '',
    };
    const restore = (saved) => {
      const value = saved && saved.privateContent;
      if (!value || typeof value !== 'object') return;
      if (['auto', 'light', 'dark'].includes(value.appearance)) state.appearance = value.appearance;
      if (['desktop', 'phone'].includes(value.device)) state.device = value.device;
      if (['uk', 'ru'].includes(value.locale)) state.locale = value.locale;
      if (['available', 'out', 'request', 'no-photo'].includes(value.productState))
        state.productState = value.productState;
    };
    restore(window.openai?.widgetState);
    const save = () => {
      if (!window.openai?.setWidgetState) return;
      window.openai
        .setWidgetState({
          modelContent: {
            concept: 'Kedr product detail',
            theme: state.appearance,
            viewport: state.device,
            locale: state.locale,
            productState: state.productState,
          },
          privateContent: {
            appearance: state.appearance,
            device: state.device,
            locale: state.locale,
            productState: state.productState,
          },
        })
        .catch(() => {});
    };
    const icons = () => {
      if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { 'stroke-width': 1.75 } });
    };
    const d = () => dictionaries[state.locale];
    function render() {
      const text = d();
      root.style.colorScheme = state.appearance === 'auto' ? 'light dark' : state.appearance;
      q('.kp-device').style.maxWidth = state.device === 'phone' ? '390px' : '1440px';
      q('.kp-page').lang = state.locale;
      qa('[data-copy]').forEach((el) => {
        el.textContent = text[el.dataset.copy];
      });
      qa('[data-aria]').forEach((el) => {
        el.setAttribute('aria-label', text[el.dataset.aria]);
      });
      qa('[data-lang]').forEach((el) => {
        el.setAttribute('aria-current', String(el.dataset.lang === state.locale));
      });
      q('[data-search]').placeholder = text.search;
      q('[data-search]').setAttribute('aria-label', text.search);
      const isOut = state.productState === 'out';
      q('[data-stock]').textContent = isOut ? text.outStock : text.inStock;
      q('[data-stock]').classList.toggle('kp-out', isOut);
      q('[data-fact-stock]').textContent = isOut ? text.outStock : text.inStock;
      q('[data-price]').classList.toggle('kp-request', state.productState === 'request');
      q('[data-price]').innerHTML =
        state.productState === 'request' ? text.requestPrice : '420<span>₴</span>';
      q('[data-buy-label]').textContent = isOut
        ? text.outAction
        : state.productState === 'request'
          ? text.requestAction
          : state.added
            ? text.added
            : text.buy;
      q('[data-action="buy"] .kp-icon').style.display =
        isOut || state.productState === 'request' ? 'none' : '';
      q('[data-qty]').textContent = state.qty;
      q('[data-action="minus"]').disabled =
        state.qty === 1 || isOut || state.productState === 'request';
      q('[data-action="plus"]').disabled =
        isOut || state.productState === 'request' || state.qty >= 99;
      q('[data-status]').textContent = state.message ? text[state.message] : '';
      q('[data-cart-count]').hidden = state.cart === 0;
      q('[data-cart-count]').textContent = state.cart;
      q('[data-photo-art]').hidden = state.productState === 'no-photo';
      q('[data-missing]').hidden = state.productState !== 'no-photo';
      q('.kp-thumbs').hidden = state.productState === 'no-photo';
      q('[data-photo-index]').hidden = state.productState === 'no-photo';
      q('[data-photo-count]').hidden = state.productState === 'no-photo';
      q('[data-product-image]').alt =
        text.productName +
        (state.locale === 'uk' ? ' — ілюстративне фото Kedr' : ' — иллюстративное фото Kedr');
      q('[data-action="zoom"]').hidden = state.productState === 'no-photo';
      q('[data-photo-stage]').classList.toggle('kp-zoomed', state.zoom);
      q('[data-action="zoom"]').setAttribute('aria-pressed', String(state.zoom));
      q('[data-drawer]').hidden = !state.menu;
      q('[data-action="menu"]').setAttribute('aria-expanded', String(state.menu));
      q('[data-cart-panel]').hidden = !state.cartOpen;
      q('[data-action="cart"]').setAttribute('aria-expanded', String(state.cartOpen));
      q('[data-cart-panel]').setAttribute('aria-label', text.cart);
      q('[data-cart-body]').innerHTML = state.cart
        ? `<strong>${text.productName}</strong><p style="margin-top:9px;color:var(--kp-sub)">${state.cart} ${text.units} × 420 ₴</p><div class="kp-cart-total"><span>${text.sum}</span><strong>${(state.cart * 420).toLocaleString(state.locale === 'uk' ? 'uk-UA' : 'ru-RU')} ₴</strong></div>`
        : text.emptyCart;
    }
    root.addEventListener('click', (event) => {
      const lang = event.target.closest('[data-lang]');
      if (lang) {
        state.locale = lang.dataset.lang;
        render();
        save();
        return;
      }
      const button = event.target.closest('[data-action]');
      if (!button) {
        if (event.target.closest('.kp-drawer a')) {
          state.menu = false;
          render();
        }
        const section = event.target.closest('.kp-sectionnav a');
        if (section) {
          qa('.kp-sectionnav a').forEach((link) => link.removeAttribute('aria-current'));
          section.setAttribute('aria-current', 'location');
        }
        return;
      }
      switch (button.dataset.action) {
        case 'theme': {
          const dark =
            state.appearance === 'dark' ||
            (state.appearance === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
          state.appearance = dark ? 'light' : 'dark';
          break;
        }
        case 'plus':
          state.qty = Math.min(99, state.qty + 1);
          state.added = false;
          state.message = '';
          break;
        case 'minus':
          state.qty = Math.max(1, state.qty - 1);
          state.added = false;
          state.message = '';
          break;
        case 'buy':
          if (state.productState === 'out') {
            state.message = 'outMessage';
            q('#kp-help').scrollIntoView({ block: 'center', behavior: 'auto' });
          } else if (state.productState === 'request') {
            state.message = 'queryMessage';
            q('#kp-help').scrollIntoView({ block: 'center', behavior: 'auto' });
          } else {
            state.cart += state.qty;
            state.added = true;
            state.message = 'addedMessage';
          }
          break;
        case 'zoom':
          state.zoom = !state.zoom;
          break;
        case 'photo':
          state.zoom = false;
          break;
        case 'copy':
          state.message = 'copied';
          if (navigator.clipboard?.writeText)
            navigator.clipboard.writeText('DEMO-001').catch(() => {});
          break;
        case 'menu':
          state.menu = !state.menu;
          state.cartOpen = false;
          break;
        case 'menu-close':
          state.menu = false;
          break;
        case 'cart':
          state.cartOpen = !state.cartOpen;
          state.menu = false;
          break;
        case 'cart-close':
          state.cartOpen = false;
          break;
      }
      render();
      save();
    });
    root.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        state.menu = false;
        state.cartOpen = false;
        render();
      }
    });
    render();
    icons();
    if (globalThis.Tweak) {
      const tweak = new Tweak({
        container: root,
        onChange: () => {
          state.added = false;
          state.message = '';
          state.menu = false;
          state.cartOpen = false;
          render();
          save();
        },
      });
      tweak.addSelect(state, 'device', {
        label: 'Экран',
        options: [
          { label: 'Компьютер', value: 'desktop' },
          { label: 'Телефон', value: 'phone' },
        ],
      });
      tweak.addSelect(state, 'appearance', {
        label: 'Тема',
        options: [
          { label: 'Как в приложении', value: 'auto' },
          { label: 'Светлая', value: 'light' },
          { label: 'Тёмная', value: 'dark' },
        ],
      });
      tweak.addSelect(state, 'locale', {
        label: 'Язык',
        options: [
          { label: 'Українська', value: 'uk' },
          { label: 'Русский', value: 'ru' },
        ],
      });
      tweak.addSelect(state, 'productState', {
        label: 'Состояние товара',
        options: [
          { label: 'В наличии', value: 'available' },
          { label: 'Нет в наличии', value: 'out' },
          { label: 'Цена по запросу', value: 'request' },
          { label: 'Без фотографии', value: 'no-photo' },
        ],
      });
    }
    window.addEventListener('openai:set_globals', (event) => {
      if (event.detail?.globals?.widgetState) {
        restore(event.detail.globals.widgetState);
        render();
      }
    });
  })();
</script>
