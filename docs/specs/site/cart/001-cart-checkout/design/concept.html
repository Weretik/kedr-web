      if (!canSubmit()) {
        updateForm();
        root.querySelector(!validName() ? '#kd-first-name' : '#kd-phone')?.focus();
        return;
      }
      state.pending = true;
      state.error = '';
      state.serverFields = {};
      const request = ++state.request;
      render();
      setTimeout(() => {
        if (request !== state.request) return;
        state.pending = false;
        if (preview.outcome === 'success') {
          state.accepted = { total: total(), count: count() };
          state.success = true;
          state.lines = [];
          state.name = '';
          state.phone = '';
          state.touched = { name: false, phone: false };
          state.notice = '';
        } else {
          state.error = preview.outcome;
          if (preview.outcome === 'validation') state.serverFields = { phone: 'serverPhoneError' };
        }
        render();
        remember();
      }, 650);
    });
    root.addEventListener('keydown', (event) => {
      if (!state.drawer) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        state.drawer = false;
        render('header-cart');
        remember();
        return;
      }
      if (event.key !== 'Tab') return;
      const controls = [
        ...root
          .querySelector('.kd-sheet')
          .querySelectorAll('button:not([disabled]),input:not([disabled]),a[href]'),
      ];
      const first = controls[0];
      const last = controls[controls.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      }
      if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });
    applySaved(window.openai?.widgetState);
    render();
    window.addEventListener('openai:set_globals', (event) => {
      const snapshot = event.detail?.globals?.widgetState;
      if (snapshot) {
        applySaved(snapshot);
        render();
      }
    });
    let lastScenario = preview.scenario;
    if (globalThis.Tweak) {
      const tweak = new Tweak({
        container: root,
        onChange: () => {
          if (preview.scenario !== lastScenario) {
            lastScenario = preview.scenario;
            state.request++;
            state.pending = false;
            state.lines = freshLines();
            state.name = '';
            state.phone = '';
            state.error = '';
            state.serverFields = {};
            state.notice = '';
            state.touched = { name: false, phone: false };
            state.success = false;
            state.drawer = preview.scenario === 'cart';
            if (preview.scenario === 'empty') state.lines = [];
            if (preview.scenario === 'validation') {
              state.name = 'Ів';
              state.phone = '+38 (068) 71';
              state.touched = { name: true, phone: true };
            }
            if (preview.scenario === 'success') {
              state.accepted = { total: total(), count: count() };
              state.success = true;
              state.lines = [];
            }
          }
          render(state.drawer ? 'close-cart' : undefined);
          remember();
        },
      });
      tweak.addToggle(preview, 'mobile', { label: 'Экран телефона' });
      tweak.addSelect(state, 'theme', {
        label: 'Тема',
        options: [
          { label: 'Как в приложении', value: 'auto' },
          { label: 'Светлая', value: 'light' },
          { label: 'Тёмная', value: 'dark' },
        ],
      });
      tweak.addSelect(state, 'locale', {
        label: 'Язык',
        options: [
          { label: 'Українська', value: 'uk' },
          { label: 'Русский', value: 'ru' },
        ],
      });
      tweak.addSelect(preview, 'scenario', {
        label: 'Состояние',
        options: [
          { label: 'Оформление заказа', value: 'order' },
          { label: 'Корзина из шапки', value: 'cart' },
          { label: 'Пустая корзина', value: 'empty' },
          { label: 'Ошибки полей', value: 'validation' },
          { label: 'Заказ принят', value: 'success' },
        ],
      });
      tweak.addSelect(preview, 'outcome', {
        label: 'Ответ при отправке',
        options: [
          { label: 'Успешно', value: 'success' },
          { label: 'Ошибка сервера', value: 'request' },
          { label: 'Ошибки полей от сервера', value: 'validation' },
          { label: 'Требуется уточнение', value: 'conflict' },
          { label: 'Нет подтверждения', value: 'timeout' },
        ],
      });
    }
  })();
</script>
